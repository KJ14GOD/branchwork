packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  electron: true
  node-pty: true
  # Windows installer builder. We target macOS, so its postinstall never needs
  # to run — but pnpm 11 exits non-zero on an undecided build, and
  # electron-builder shells out to `pnpm install` internally, so leaving this
  # undecided fails the packaging run rather than merely warning.
  electron-winstaller: false
